<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eine Frage an dich ☕️</title>
<meta name="theme-color" content="#f4f6f8">
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1d2733;
    --muted: #6b7785;
    --yes: #1f9d6b;
    --yes-hover: #178158;
    --no: #e8ecf0;
    --no-text: #44505e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }
  .card {
    background: var(--card);
    position: relative;
    min-height: 340px;
    width: 100%;
    max-width: 420px;
    padding: 36px 28px 32px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(20, 35, 55, 0.08);
    text-align: center;
    animation: pop .5s ease-out both;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }
  h1 {
    font-size: 1.35rem;
    line-height: 1.4;
    font-weight: 600;
    margin: 0 0 32px;
  }
  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    min-height: 52px;
  }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 12px;
    padding: 14px 28px;
    cursor: pointer;
    transition: background .15s, transform .15s;
    -webkit-tap-highlight-color: transparent;
  }
  #yes { background: var(--yes); color: #fff; }
  #yes:hover { background: var(--yes-hover); transform: translateY(-1px); }
  #no { background: var(--no); color: var(--no-text); }
  #no.floating { position: absolute; z-index: 10; transition: left .2s ease, top .2s ease; }
  .result { display: none; animation: pop .4s ease-out both; }
  .result .big { font-size: 3rem; margin-bottom: 8px; }
  .result h2 { margin: 0 0 6px; font-size: 1.3rem; }
  .result p { margin: 0; color: var(--muted); }
  .result.ok h2 { color: var(--yes); }
</style>
</head>
<body>

<main class="card" id="card">
  <div id="question">
    <h1 id="title"></h1>
    <div class="buttons" id="buttons">
      <button id="yes" type="button">Ja 😊</button>
      <button id="no" type="button">Nein</button>
    </div>
  </div>

  <div class="result ok" id="resultYes">
    <div class="big">🎉</div>
    <h2>Perfekt, ich freue mich :)</h2>
  </div>

  <div class="result" id="resultNo">
    <div class="big">🙂</div>
  </div>
</main>

<script>
  const CONFIG = {
    name: "Emma",
    text: "wie sieht's aus: Morgen um 14 Uhr Café-Date an der Alster? ☕️",
    maxDodges: 100
  };

  const urlName = new URLSearchParams(location.search).get("name");
  const name = (urlName || CONFIG.name).slice(0, 30);

  const $ = id => document.getElementById(id);
  const yes = $("yes"), no = $("no");

  $("title").textContent = name + ", " + CONFIG.text;

  let dodges = 0;
  let canClickNo = false;

  const card = $("card");
  let placeholder = null;

  function overlaps(a, b) {
    return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
  }

  function moveButton() {
    if (canClickNo) return;
    dodges++;

    const cardRect = card.getBoundingClientRect();
    const w = no.offsetWidth, h = no.offsetHeight;

    if (!no.classList.contains("floating")) {
      const r = no.getBoundingClientRect();
      placeholder = document.createElement("span");
      placeholder.style.width = r.width + "px";
      placeholder.style.height = r.height + "px";
      no.parentNode.insertBefore(placeholder, no);
      no.style.left = (r.left - cardRect.left) + "px";
      no.style.top = (r.top - cardRect.top) + "px";
      no.classList.add("floating");
      void no.offsetWidth;
    }

    const margin = 14;
    const maxX = card.clientWidth - w - margin;
    const maxY = card.clientHeight - h - margin;
    const yesRect = yes.getBoundingClientRect();
    let x, y;
    for (let i = 0; i < 30; i++) {
      x = margin + Math.random() * Math.max(0, maxX - margin);
      y = margin + Math.random() * Math.max(0, maxY - margin);
      const test = {
        left: cardRect.left + x - 8, right: cardRect.left + x + w + 8,
        top: cardRect.top + y - 8, bottom: cardRect.top + y + h + 8
      };
      if (!overlaps(test, yesRect)) break;
    }
    no.style.left = x + "px";
    no.style.top = y + "px";

    if (dodges >= CONFIG.maxDodges) {
      canClickNo = true;
      no.classList.remove("floating");
      no.style.left = no.style.top = "";
      if (placeholder) { placeholder.remove(); placeholder = null; }
      no.textContent = "Nein, danke";
    }
  }

  no.addEventListener("mouseover", moveButton);
  no.addEventListener("touchstart", e => {
    if (!canClickNo) { e.preventDefault(); moveButton(); }
  }, { passive: false });

  no.addEventListener("click", e => {
    if (!canClickNo) { e.preventDefault(); moveButton(); return; }
    $("question").style.display = "none";
    $("resultNo").style.display = "block";
  });

  yes.addEventListener("click", () => {
    no.style.display = "none";
    $("question").style.display = "none";
    $("resultYes").style.display = "block";
  });
</script>
</body>
</html>
